# 打包 mpv (Windows 便携版) + mpvacious 制卡插件
#
# 流程:
#   1. 从 shinchiro/mpv-winbuild-cmake 的 latest release 下载每日构建
#      (mpv.io 官方推荐的 Windows 构建,自带完整 ffmpeg 与编码支持)
#   2. 按官方安装方式把 mpvacious (latest release) 装进 portable_config/scripts/
#   3. 写入预置的 mpv.conf、input.conf 与 script-opts/subs2srs.conf
#   4. 打包为 zip 并创建 GitHub Release
#
# 触发:手动 (workflow_dispatch) 或每周一定时检查;版本组合未变化时自动跳过。

name: mpv portable (Windows) + mpvacious

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1" # 每周一 03:00 UTC (北京时间 11:00)

permissions:
  contents: write

concurrency:
  group: mpv-portable-release
  cancel-in-progress: false

env:
  MPV_REPO: shinchiro/mpv-winbuild-cmake
  MPVACIOUS_REPO: Ajatt-Tools/mpvacious
  # shinchiro 每日构建的通用 x86_64 版(含完整 ffmpeg/编码支持;不含 v3、i686、aarch64、dev 变体)
  MPV_ASSET_RE: '^mpv-x86_64-[0-9]{8}-git-[0-9a-f]+\.7z$'

jobs:
  build:
    name: Build portable zip and release
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Resolve latest versions
        id: versions
        run: |
          set -euo pipefail

          mpv_release=$(gh api "repos/${MPV_REPO}/releases/latest")
          mpv_tag=$(jq -r '.tag_name' <<<"$mpv_release")
          mpv_asset=$(jq -r --arg re "$MPV_ASSET_RE" \
            '.assets | map(select(.name | test($re))) | .[0].name // empty' <<<"$mpv_release")
          if [[ -z "$mpv_asset" ]]; then
            echo "在 ${MPV_REPO}@${mpv_tag} 中找不到匹配 ${MPV_ASSET_RE} 的资产" >&2
            exit 1
          fi

          vacious_tag=$(gh api "repos/${MPVACIOUS_REPO}/releases/latest" --jq '.tag_name')

          # 资产名形如 mpv-x86_64-20260830-git-e8673660ab.7z,提取 20260830-git-e8673660ab 作为版本标识
          mpv_build=$(sed -E 's/^mpv-x86_64-([0-9]{8}-git-[0-9a-f]+)\.7z$/\1/' <<<"$mpv_asset")
          if [[ "$mpv_build" == "$mpv_asset" ]]; then
            echo "无法从资产名 ${mpv_asset} 解析版本" >&2
            exit 1
          fi

          {
            echo "mpv_asset=${mpv_asset}"
            echo "mpv_url=https://github.com/${MPV_REPO}/releases/download/${mpv_tag}/${mpv_asset}"
            echo "mpv_build=${mpv_build}"
            echo "vacious_tag=${vacious_tag}"
            echo "vacious_url=https://github.com/${MPVACIOUS_REPO}/releases/download/${vacious_tag}/mpvacious_${vacious_tag}.zip"
            echo "release_tag=mpv-${mpv_build}-mpvacious-${vacious_tag}"
          } >> "$GITHUB_OUTPUT"

      - name: Skip if this combination was already released
        id: check
        env:
          RELEASE_TAG: ${{ steps.versions.outputs.release_tag }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release ${RELEASE_TAG} 已存在,跳过构建。"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download mpv and mpvacious
        if: steps.check.outputs.exists != 'true'
        env:
          MPV_URL: ${{ steps.versions.outputs.mpv_url }}
          MPVACIOUS_URL: ${{ steps.versions.outputs.vacious_url }}
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o mpv.7z "$MPV_URL"
          curl -fL --retry 3 -o mpvacious.zip "$MPVACIOUS_URL"

      - name: Assemble portable package
        if: steps.check.outputs.exists != 'true'
        run: |
          set -euo pipefail

          # 解压 7z 需要 p7zip(runner 通常自带,缺失时安装)
          command -v 7z >/dev/null 2>&1 || { sudo apt-get update -qq && sudo apt-get install -y -qq p7zip-full; }

          7z x -y mpv.7z -ompv-extracted
          mkdir package

          # mpv.exe 位于压缩包内的版本化子目录中
          mpv_dir=$(dirname "$(find mpv-extracted -name mpv.exe -print -quit)")
          cp -a "${mpv_dir}/." package/

          # mpvacious 官方安装方式:解压到 scripts/ -> scripts/mpvacious/(入口 main.lua)
          mkdir -p package/portable_config/scripts package/portable_config/script-opts
          unzip -q mpvacious.zip -d package/portable_config/scripts
          test -f package/portable_config/scripts/mpvacious/main.lua

          # 全局播放设置
          cat > package/portable_config/mpv.conf <<'EOF'
          sub-pos=100
          secondary-sub-pos=90
          hwdec=auto
          force-window=yes
          screenshot-format=webp
          screenshot-webp-quality=92
          screenshot-webp-compression=6
          screenshot-template="%F/%p-%n"
          screenshot-directory=~~desktop/mpv-screenshots
          save-position-on-quit=yes
          write-filename-in-watch-later-config=yes
          EOF

          # 快捷键
          cat > package/portable_config/input.conf <<'EOF'
          s screenshot video
          S screenshot subtitles
          alt+j cycle secondary-sid
          alt+J cycle secondary-sid down
          right seek 2
          left seek -2
          ctrl+h sub-seek -1
          ctrl+l sub-seek 1
          alt+shift+UP   add secondary-sub-pos -1
          alt+shift+DOWN add secondary-sub-pos +1
          EOF

          # mpvacious 配置
          cat > package/portable_config/script-opts/subs2srs.conf <<'EOF'
          deck_name=Default
          model_name=Lapis
          sentence_field=Sentence
          audio_field=SentenceAudio
          image_field=Picture
          note_tag=
          menu_font_size=24
          menu_font_name=Yu Gothic UI

          ankiconnect_url=127.0.0.1:8765
          use_ffmpeg=no
          create_deck=yes
          allow_duplicates=no
          autoclip=yes
          autoclip_method=clipboard
          nuke_spaces=yes
          tie_volumes=no
          clipboard_trim_enabled=yes

          append_media=yes
          tag_nuke_brackets=yes
          tag_nuke_parentheses=no
          tag_del_episode_num=yes
          tag_del_after_episode_num=yes
          tag_filename_lowercase=no
          disable_gui_browse=no
          preview_audio=no
          show_selected_text=yes
          reload_config_before_card_creation=yes
          snapshot_format=webp
          snapshot_quality=70
          snapshot_width=1920
          snapshot_height=-2
          screenshot=no
          image_template=<img alt="snapshot" src="%s">
          audio_template=[sound:%s]
          animated_snapshot_enabled=no
          animated_snapshot_format=avif
          animated_snapshot_fps=30
          animated_snapshot_width=-2
          animated_snapshot_height=720
          animated_snapshot_quality=30
          audio_format=opus
          opus_container=m4a
          audio_bitrate=32k
          audio_padding=0.1
          use_forvo=yes
          vocab_field=VocabKanji
          vocab_audio_field=VocabAudio
          miscinfo_enable=yes
          miscinfo_field=Notes
          miscinfo_format=%n EP%d (%t)
          secondary_sub_auto_load=yes
          secondary_sub_lang=chi,zh-CN,sc,chs
          secondary_sub_area=0.7
          secondary_sub_visibility=always
          loudnorm=no
          loudnorm_target=-16
          loudnorm_range=11
          loudnorm_peak=-1.5
          ffmpeg_audio_args=-af loudnorm=I=-16:TP=-1.5:LRA=11:dual_mono=true
          mpv_audio_args=--af-append=loudnorm=I=-16:TP=-1.5:LRA=11:dual_mono=true
          EOF

          # 包内说明
          cat > package/README.txt <<'EOF'
          mpv 便携版 + mpvacious 制卡插件(Windows x86_64)

          使用:
          1. 解压到任意目录,直接运行 mpv.exe。全部配置都在 portable_config 目录内,
             完全便携,不写入系统配置目录。
          2. 制卡前保持 Anki 桌面版运行,并安装 AnkiConnect 插件(代码 2055492159)。
          3. 用 mpv 打开带字幕的视频:
             a        打开 mpvacious 菜单
             Ctrl+n   用当前字幕行一键制卡
             Ctrl+c   复制当前字幕文本
          4. 播放 YouTube 等网络视频需自行安装 yt-dlp 并加入 PATH。
          5. 按 q 退出自动记住播放位置,下次打开同一文件继续;按 s/S 截图为 webp,
             保存到桌面的 mpv-screenshots 文件夹下以视频文件名命名的子文件夹
             (如需换位置可修改 mpv.conf 中的 screenshot-directory)。

          常见问题:
          - 本构建自带完整 ffmpeg 与编码支持,subs2srs.conf 中 use_ffmpeg=no 即可直接截取音频;
            如需改用外部 ffmpeg,安装后把 use_ffmpeg 改为 yes。
          - 牌组/笔记类型名需与 Anki 中一致,见 subs2srs.conf 的 deck_name 与 model_name。
          - 菜单字体默认使用系统自带的 Yu Gothic UI(游ゴシック UI);偏好明朝体可改为
            Yu Mincho(需系统装有日文补充字体)。

          目录结构:
            mpv.exe               播放器主程序
            portable_config/
              mpv.conf            全局播放设置(硬解、webp 截图、记住播放位置)
              input.conf          自定义快捷键
              script-opts/
                subs2srs.conf     mpvacious 配置
              scripts/
                mpvacious/        mpvacious 插件

          版本信息见下载本压缩包的 GitHub Release 页面。
          EOF

      - name: Package zip
        id: package
        if: steps.check.outputs.exists != 'true'
        env:
          MPV_BUILD: ${{ steps.versions.outputs.mpv_build }}
          MPVACIOUS_TAG: ${{ steps.versions.outputs.vacious_tag }}
        run: |
          set -euo pipefail
          zip_name="mpv-x86_64-${MPV_BUILD}-portable-mpvacious-${MPVACIOUS_TAG}.zip"
          (cd package && zip -qr9 "../${zip_name}" .)
          sha256sum "${zip_name}" > "${zip_name}.sha256"
          echo "zip_name=${zip_name}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        if: steps.check.outputs.exists != 'true'
        env:
          MPV_BUILD: ${{ steps.versions.outputs.mpv_build }}
          MPVACIOUS_TAG: ${{ steps.versions.outputs.vacious_tag }}
          RELEASE_TAG: ${{ steps.versions.outputs.release_tag }}
          ZIP_NAME: ${{ steps.package.outputs.zip_name }}
        run: |
          set -euo pipefail

          cat > release-notes.md <<EOF
          自动构建的 mpv Windows 便携包,预装 mpvacious 制卡插件。

          - mpv: ${MPV_BUILD}(每日构建,来自 shinchiro/mpv-winbuild-cmake latest release,含完整 ffmpeg 与编码支持)
          - mpvacious: ${MPVACIOUS_TAG}(来自 Ajatt-Tools/mpvacious latest release)

          ## 使用

          1. 解压到任意目录,运行 mpv.exe。所有配置都在 portable_config 内,完全便携。
          2. 保持 Anki 桌面版运行,并安装 AnkiConnect 插件(代码 2055492159)。
          3. 用 mpv 打开带字幕的视频,按 a 打开 mpvacious 菜单,Ctrl+n 一键制卡。

          ## 预置配置

          - portable_config/mpv.conf:硬件解码、字幕位置、webp 截图(存至桌面 mpv-screenshots)、记住播放位置等全局设置
          - portable_config/input.conf:截图、次字幕切换、逐句跳转等快捷键
          - portable_config/script-opts/subs2srs.conf:mpvacious 配置(Lapis 笔记类型,菜单字体 Yu Gothic UI)

          ## 注意

          - 构建源为 shinchiro 每日构建,自带编码支持,use_ffmpeg=no 也可正常截取音频。
          - 播放网络视频(YouTube 等)需自行安装 yt-dlp。
          - 制卡依赖本地运行的 Anki + AnkiConnect(127.0.0.1:8765)。
          EOF

          gh release create "$RELEASE_TAG" \
            "$ZIP_NAME" \
            "$ZIP_NAME.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "mpv ${MPV_BUILD} (Windows x86_64) + mpvacious ${MPVACIOUS_TAG}" \
            --notes-file release-notes.md
